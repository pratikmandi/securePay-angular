<div class="login-container">
  <div class="form-container">
    <img src="./assets/images/mpokket.png" class="mpokket-logo" alt="" />
    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <h2>Sign in</h2>
      <div class="form-field">
        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          placeholder="name@company.com"
          formControlName="email"
          autocomplete="email"
          required
        />
        <small>{{ showEmailValidationError() }}</small>
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          placeholder="Password"
          formControlName="password"
          autocomplete="current-password"
          required
        />
        <small>{{ showPasswordValidationError() }}</small>
      </div>

      <button type="submit" class="login-btn">Sign in</button>
    </form>
    <div>
      <p>
        New user?
        <strong><a routerLink="/register">Create an account</a></strong>
      </p>
    </div>
  </div>
</div>
