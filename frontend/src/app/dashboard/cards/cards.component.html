<div class="container">
  <div class="cards-grid">
    <app-card-detail
      *ngFor="let card of cards"
      [card]="card"
      (cardUpdated)="loadCards()"
    >
    </app-card-detail>
  </div>
  <p class="empty-hint" *ngIf="!cards.length">
    No cards registered. Use the button below to add one.
  </p>
</div>
<div class="add-card" (click)="showForm = true" title="Add card">+</div>

<app-add-card
  *ngIf="showForm"
  (cardAdded)="loadCards(); showForm = false"
  (dismiss)="showForm = false"
></app-add-card>
